server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: farm-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/farms/**

        - id: harvest-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/harvests/**
