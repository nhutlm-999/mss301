server:
  port: 8080
spring:
  application:
    name: learning-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
#            Doi id va predicates cho 2 services theo yeu cau cua de
            - id: course-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/courses/**
            - id: enrollment-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/enrollments/**
            - id: course-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/course/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: enrollment-service-docs
              uri: http://localhost:8082
              predicates:
                - Path=/enrollment/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Course Service
        url: /course/v3/api-docs
      - name: Enrollment Service
        url: /enrollment/v3/api-docs

