server:
  port: 8081

spring:
  application:
    name: room-service

  datasource:
    #  Doi ten db theo de
    url: jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE;encrypt=false;
    username: sa
    password: 123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

