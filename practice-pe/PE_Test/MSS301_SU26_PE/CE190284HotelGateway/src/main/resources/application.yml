server:
  port: 8080
spring:
  application:
    name: hotel-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Doi id va predicates cho 2 services theo yeu cau cua de
            - id: room-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/rooms/**
            - id: reservation-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/reservations/**
            - id: room-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/room/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: reservation-service-docs
              uri: http://localhost:8082
              predicates:
                - Path=/reservation/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Room Service
        url: /room/v3/api-docs
      - name: Reservation Service
        url: /reservation/v3/api-docs

